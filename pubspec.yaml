name: ekeyless
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  #manejar el estado de la aplicación de manera reactiva y eficiente
  get: ^4.7.2
  # Backend: autenticación, PostgreSQL, Realtime y Storage
  supabase_flutter: ^2.15.4
  #formateador de fechas y horas
  intl: ^0.20.2

  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.3
  
  #librería para gestionar el bluetooth
  flutter_blue_plus: ^1.35.5
  permission_handler: ^12.0.0+1
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true
  #seccion para definir recursos de la aplicacion
  assets:
    - assets/default_avatar.png
    - assets/google_logo.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/logo.png
