<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <marker id="openArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 7 L 1 13" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 34px Inter, Arial, sans-serif; fill: #14243a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #5b6b80; }
      .class { fill: #ffffff; stroke: #4b607a; stroke-width: 2; }
      .head { fill: #e6eef8; }
      .head-teal { fill: #d9f0ed; }
      .head-dark { fill: #dce7f7; }
      .classname { font: 700 22px Inter, Arial, sans-serif; fill: #1d3554; }
      .stereo { font: 400 16px Inter, Arial, sans-serif; fill: #48617f; }
      .member { font: 400 18px Inter, Arial, sans-serif; fill: #26384e; }
      .small { font: 400 16px Inter, Arial, sans-serif; fill: #53657b; }
      .relation { fill: none; stroke: #334155; stroke-width: 2.1; stroke-linejoin: round; stroke-linecap: round; }
      .dashed { stroke-dasharray: 8 7; }
      .line-label { font: 600 16px Inter, Arial, sans-serif; fill: #334155; }
      .note { fill: #fffdf3; stroke: #c5a85e; stroke-width: 1.8; stroke-dasharray: 6 5; }
      .note-text { font: 400 17px Inter, Arial, sans-serif; fill: #4d452e; }
      .footer { font: 400 17px Inter, Arial, sans-serif; fill: #43556c; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1020"/>
  <text class="title" x="70" y="58">Patrón Decorator — eKeyLess</text>
  <text class="subtitle" x="70" y="91">Versión actualizada: registro de operaciones en el canal de comandos Bluetooth</text>

  <!-- Relaciones, detrás de las clases -->
  <!-- El controlador mantiene una referencia al contrato común. -->
  <path class="relation" d="M 460 215 L 620 215" marker-end="url(#openArrow)"/>
  <text class="line-label" x="514" y="198">usa</text>

  <!-- El decorador base realiza la interfaz. -->
  <path class="relation dashed" d="M 850 420 L 850 320"/>
  <polygon points="850,300 836,320 864,320" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="line-label" x="870" y="348">realiza</text>

  <!-- La clase Bluetooth implementa la misma interfaz. -->
  <path class="relation dashed" d="M 1365 420 L 1365 340 L 1050 340 L 1050 320"/>
  <polygon points="1050,300 1036,320 1064,320" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="line-label" x="1165" y="326">realiza</text>

  <!-- Referencia del decorador base al canal envuelto (_delegate). -->
  <path class="relation" d="M 620 465 L 550 465 L 550 260 L 620 260" marker-end="url(#openArrow)"/>
  <text class="line-label" x="532" y="370" text-anchor="middle" transform="rotate(-90 532 370)">_delegate : LockCommandChannel</text>

  <!-- El decorador concreto hereda del decorador base. -->
  <path class="relation" d="M 850 740 L 850 632"/>
  <polygon points="850,610 836,632 864,632" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="line-label" x="870" y="681">hereda</text>

  <!-- CandadoBLEController -->
  <g>
    <rect class="class" x="70" y="145" width="390" height="155" rx="7"/>
    <path class="head" d="M77 145 H453 Q460 145 460 152 V201 H70 V152 Q70 145 77 145 Z"/>
    <line x1="70" y1="201" x2="460" y2="201" stroke="#4b607a" stroke-width="1.8"/>
    <text class="classname" x="265" y="180" text-anchor="middle">CandadoBLEController</text>
    <text class="member" x="92" y="238">- _commandChannel: LockCommandChannel</text>
    <text class="small" x="92" y="270">Solicita el envío de comandos</text>
  </g>

  <!-- Interfaz común -->
  <g>
    <rect class="class" x="620" y="145" width="460" height="155" rx="7"/>
    <path class="head-teal" d="M627 145 H1073 Q1080 145 1080 152 V213 H620 V152 Q620 145 627 145 Z"/>
    <line x1="620" y1="213" x2="1080" y2="213" stroke="#4b607a" stroke-width="1.8"/>
    <text class="stereo" x="850" y="170" text-anchor="middle">«interface»</text>
    <text class="classname" x="850" y="197" text-anchor="middle">LockCommandChannel</text>
    <text class="member" x="642" y="250">+ enviar(device: LockDevice, comando: String)</text>
    <text class="member" x="662" y="278">: Future&lt;void&gt;</text>
  </g>

  <!-- Decorador abstracto -->
  <g>
    <rect class="class" x="620" y="420" width="460" height="190" rx="7"/>
    <path class="head-dark" d="M627 420 H1073 Q1080 420 1080 427 V476 H620 V427 Q620 420 627 420 Z"/>
    <line x1="620" y1="476" x2="1080" y2="476" stroke="#4b607a" stroke-width="1.8"/>
    <text class="stereo" x="850" y="443" text-anchor="middle">«abstract»</text>
    <text class="classname" x="850" y="468" text-anchor="middle">LockCommandChannelDecorator</text>
    <text class="member" x="644" y="511">- _delegate: LockCommandChannel</text>
    <text class="member" x="644" y="548">+ enviar(device, comando): Future&lt;void&gt;</text>
    <text class="small" x="644" y="579">Delega la operación al canal envuelto</text>
  </g>

  <!-- Canal concreto Bluetooth -->
  <g>
    <rect class="class" x="1200" y="420" width="330" height="180" rx="7"/>
    <path class="head" d="M1207 420 H1523 Q1530 420 1530 427 V472 H1200 V427 Q1200 420 1207 420 Z"/>
    <line x1="1200" y1="472" x2="1530" y2="472" stroke="#4b607a" stroke-width="1.8"/>
    <text class="classname" x="1365" y="451" text-anchor="middle">BluetoothCommandChannel</text>
    <text class="member" x="1220" y="505">- _gateway: BleLockGateway</text>
    <text class="member" x="1220" y="538">+ enviar(device, comando)</text>
    <text class="member" x="1240" y="566">: Future&lt;void&gt;</text>
  </g>

  <!-- Decorador concreto de registro -->
  <g>
    <rect class="class" x="620" y="740" width="460" height="165" rx="7"/>
    <path class="head-teal" d="M627 740 H1073 Q1080 740 1080 747 V797 H620 V747 Q620 740 627 740 Z"/>
    <line x1="620" y1="797" x2="1080" y2="797" stroke="#4b607a" stroke-width="1.8"/>
    <text class="classname" x="850" y="773" text-anchor="middle">LoggingLockCommandChannelDecorator</text>
    <text class="member" x="644" y="831">- _logger: LockCommandLogCallback</text>
    <text class="member" x="644" y="862">+ enviar(device, comando): Future&lt;void&gt;</text>
    <text class="small" x="644" y="888">Registra inicio, resultado/error y duración</text>
  </g>

  <!-- Nota funcional -->
  <g>
    <rect class="note" x="1140" y="738" width="390" height="152" rx="7"/>
    <text class="note-text" x="1162" y="769" font-weight="700">Responsabilidad del decorador</text>
    <text class="note-text" x="1162" y="800">• Registra el intento de envío y duración.</text>
    <text class="note-text" x="1162" y="827">• No valida ni altera el comando.</text>
    <text class="note-text" x="1162" y="854">• No confirma ejecución física del candado.</text>
  </g>

  <line x1="70" y1="940" x2="1530" y2="940" stroke="#d2dae5" stroke-width="1.5"/>
  <text class="footer" x="70" y="972">El canal Bluetooth conserva la responsabilidad del envío; la seguridad y autorización final deben comprobarse en el dispositivo.</text>
</svg>